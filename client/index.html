<!doctype html>
<html lang="en">


  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }
      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    </style>

  </head>


  
  <body>
    <main>
      <section class="py-5 text-center container">
        <div class="row py-lg-5">
          <div class="col-lg-6 col-md-8 mx-auto">
            <h1 class="fw-light">Movie Catalogue</h1>
          </div>
        </div>
      </section>


      <form id="movie_form">
        <input id="title" placeholder="Title">
        <input id="genre" placeholder="Genre">
        <input id="releaseYear" placeholder="Year">
        <input id="imageURL" placeholder="Image URL">
        <button type="submit">Add Movie</button>
      </form>



      <div class="album py-5 bg-body-tertiary">
        <div class="container">
          
          <div class="row">

            <div class="col-3">
              <h4>Actors</h4>
              <input id="actors_search" placeholder="Search Actors">
              <div id="actor-list"></div>
              
            </div>

            <div class="col-9">
              <div id="message_box" class="alert alert-danger d-none"></div>
              <div class="d-flex justify-content-end mb-3">
                <select id="genre_filter" class="form-select w-auto">
                  <option value="all">All Genres</option>
                  <option value="Sci-Fi">Sci-Fi</option>
                  <option value="Drama">Drama</option>
                  <option value="Romance">Romance</option>
                  <option value="Fantasy">Fantasy</option>
                </select>
              </div>
              <form id="search_form">
                <input name="search_term" id="search_term" placeholder="Search Movie">
              </form>
              
              <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3" id="movie-grid">
              </div>
            </div>
          </div>
        </div>
      </div>
      </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./app.js"></script>
  </body>
</html>
